<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" aria-labelledby="title">
  <title id="title">TcpRecon Architecture</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
    <style>
      .box { fill:#f8f9fa; stroke:#333; stroke-width:1; rx:6; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size:12px; fill:#111; }
    </style>
  </defs>

  <!-- Boxes -->
  <rect class="box" x="20" y="40" width="140" height="40" />
  <text class="label" x="90" y="65" text-anchor="middle">Input / Targets</text>

  <rect class="box" x="180" y="20" width="170" height="80" />
  <text class="label" x="265" y="45" text-anchor="middle">Target Expansion</text>
  <text class="label" x="265" y="62" text-anchor="middle">/ Scheduler</text>

  <rect class="box" x="370" y="20" width="160" height="80" />
  <text class="label" x="450" y="45" text-anchor="middle">Worker Pool</text>
  <text class="label" x="450" y="62" text-anchor="middle">/ Goroutines</text>

  <rect class="box" x="540" y="20" width="170" height="80" />
  <text class="label" x="625" y="45" text-anchor="middle">Network I/O</text>
  <text class="label" x="625" y="62" text-anchor="middle">(epoll/kqueue)</text>

  <rect class="box" x="720" y="10" width="220" height="100" />
  <text class="label" x="830" y="35" text-anchor="middle">Protocol Handlers</text>
  <text class="label" x="830" y="52" text-anchor="middle">TCP / TLS / HTTP</text>

  <rect class="box" x="380" y="130" width="170" height="60" />
  <text class="label" x="465" y="155" text-anchor="middle">Extraction &</text>
  <text class="label" x="465" y="172" text-anchor="middle">Normalization</text>

  <rect class="box" x="600" y="130" width="200" height="60" />
  <text class="label" x="700" y="155" text-anchor="middle">Ingestion / Output</text>
  <text class="label" x="700" y="172" text-anchor="middle">JSON / NDJSON / SIEM</text>

  <rect class="box" x="820" y="130" width="150" height="60" />
  <text class="label" x="895" y="155" text-anchor="middle">Storage /</text>
  <text class="label" x="895" y="172" text-anchor="middle">Pipeline</text>

  <rect class="box" x="20" y="130" width="140" height="60" />
  <text class="label" x="90" y="155" text-anchor="middle">Metrics &</text>
  <text class="label" x="90" y="172" text-anchor="middle">Logging</text>

  <!-- Arrows -->
  <line x1="160" y1="60" x2="180" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="350" y1="60" x2="370" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="530" y1="60" x2="540" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="710" y1="60" x2="720" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <line x1="700" y1="110" x2="625" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="540" y1="160" x2="380" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="550" y1="160" x2="600" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="800" y1="160" x2="820" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <line x1="200" y1="160" x2="160" y2="100" stroke="#ccc" stroke-width="1" />

</svg>
